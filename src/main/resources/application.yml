cor:
  url: http://localhost:8080

spring:
  application:
    name: gateway-service

  profiles:
    active: dev

  data:
    redis:
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 2
      sentinel:
        username: default


# 유레카에 gateway 등록


eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

# 게이트 웨이 포트
server:
  port: 9777

management:
  endpoints:
    web:
      exposure:
        include: health,info,pause,resume