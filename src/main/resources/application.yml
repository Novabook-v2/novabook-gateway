spring:
  application:
    name: gateway-service
  profiles:
    include: prod

  data:
    redis:
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 2
      sentinel:
        username: default

# 게이트 웨이 포트
server:
  port: 9777

management:
  endpoints:
    web:
      exposure:
        include: health,info,pause,resume


# 로깅 설정
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type: trace
    io.micrometer: debug